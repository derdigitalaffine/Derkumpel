name: generate-lock-once
on:
  push:
    branches: [work/initial-production]
    paths: [.github/workflows/generate-lock.yml]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git rm .github/workflows/generate-lock.yml
          git commit -m 'chore: lock npm dependency graph'
          git push origin HEAD:work/initial-production
