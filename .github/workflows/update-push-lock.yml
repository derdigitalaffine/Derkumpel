name: Refresh Web Push dependency lock (one time)
on:
  push:
    branches: [feature/push-ticket-map-ux]
permissions:
  contents: write
jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git rm .github/workflows/update-push-lock.yml
          if ! git diff --cached --quiet; then
            git commit -m 'build(push): lock Web Push dependencies reproducibly'
            git push origin HEAD:feature/push-ticket-map-ux
          fi
