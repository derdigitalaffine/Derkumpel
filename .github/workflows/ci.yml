name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:branding
      - name: Validate optional Redmine integration Ruby syntax
        run: find integrations/redmine/plugins/derkumpel_push -name '*.rb' -print0 | xargs -0 -n1 ruby -c
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Validate Compose
        env:
          REDMINE_BASE_URL: https://redmine.example.invalid
          PUBLIC_BASE_URL: https://derkumpel.example.invalid
          SESSION_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_HOST: derkumpel.example.invalid
        run: |
          cp .env.example .env
          printf '%s\n' 'SESSION_SECRET=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' >> .env
          docker compose config --quiet
      - run: docker build -t derkumpel:ci .
      - name: Smoke-test production image
        env:
          SESSION_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          docker run -d --name derkumpel-ci -p 18080:8080 \
            -e NODE_ENV=production \
            -e REDMINE_BASE_URL=https://redmine.example.invalid \
            -e PUBLIC_BASE_URL=https://derkumpel.example.invalid \
            -e SESSION_SECRET="$SESSION_SECRET" \
            derkumpel:ci
          trap 'docker logs derkumpel-ci || true; docker rm -f derkumpel-ci >/dev/null 2>&1 || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18080/api/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'Container did not become ready' >&2
          exit 1

      - name: Smoke-test optional enabled Web Push adapter
        env:
          SESSION_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          eval "$(node - <<'NODE'
          const keys = require('web-push').generateVAPIDKeys();
          console.log('VAPID_PUBLIC=' + keys.publicKey);
          console.log('VAPID_PRIVATE=' + keys.privateKey);
          NODE
          )"
          docker volume create derkumpel-push-ci >/dev/null
          docker run -d --name derkumpel-push-ci -p 18081:8080 \
            --read-only --tmpfs /tmp:size=32m \
            -v derkumpel-push-ci:/app/push-data \
            -e NODE_ENV=production \
            -e REDMINE_BASE_URL=https://redmine.example.invalid \
            -e PUBLIC_BASE_URL=https://derkumpel.example.invalid \
            -e SESSION_SECRET="$SESSION_SECRET" \
            -e PUSH_ENABLED=true \
            -e PUSH_VAPID_PUBLIC_KEY="$VAPID_PUBLIC" \
            -e PUSH_VAPID_PRIVATE_KEY="$VAPID_PRIVATE" \
            -e PUSH_VAPID_SUBJECT=mailto:operator@example.org \
            -e PUSH_EVENT_TOKEN=1234567890123456789012345678901234567890 \
            derkumpel:ci
          trap 'docker logs derkumpel-push-ci || true; docker rm -f derkumpel-push-ci >/dev/null 2>&1 || true; docker volume rm derkumpel-push-ci >/dev/null 2>&1 || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18081/api/push/config > /tmp/derkumpel-push.json; then
              break
            fi
            sleep 1
          done
          node -e "const x=require('/tmp/derkumpel-push.json');if(!x.enabled||!x.publicKey)process.exit(1)"
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://derkumpel.example.invalid' \
            -H 'X-DerKumpel-Event-Token: invalid-secret' \
            -d '{"event_id":"test-12345678","issue_id":1,"kind":"status","user_ids":[]}' \
            http://127.0.0.1:18081/api/push/events)
          test "$status" = 403
