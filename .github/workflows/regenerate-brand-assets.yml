name: Regenerate DerKumpel PNG assets (one time)
on:
  push:
    branches:
      - fix/raster-default-valid-png
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==11.3.0'
      - run: python apps/web/scripts/generate_brand_png.py
      - run: node scripts/check-brand-assets.mjs
      - name: Commit validated binary assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/public
          if git diff --cached --quiet; then
            echo 'Assets already generated'
          else
            git commit -m 'brand: generate valid installable DerKumpel PNG assets'
            git push origin HEAD:fix/raster-default-valid-png
          fi
